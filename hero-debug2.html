<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<title>hero E test - faithful replica</title>
<style>
  body{background:#0A0A0A;color:#fff;font-family:monospace;margin:0}
  b{position:fixed;top:8px;left:8px;z-index:99;background:#000;padding:4px 8px;font-size:12px}
  .hero-fixed{position:absolute;inset:0;z-index:0;height:100vh}
  /* exact hero.css */
  .hero-slide-img{position:absolute;inset:0;opacity:0;pointer-events:none}
  .hero-bgwrap{position:absolute;inset:0;overflow:hidden}
  [data-layer="bg"]{position:absolute;inset:0}
  .hero-slide-img [data-layer="bg"]{opacity:1;transform:none;transition:none}
  [data-layer="bg"] picture{display:block;width:100%;height:100%}
  [data-layer="bg"] img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;
    filter:grayscale(.72) contrast(1.13);will-change:transform}
  [data-layer="bg"] video{width:100%;height:100%;object-fit:cover;object-position:50% 30%;
    filter:grayscale(.72) contrast(1.13);will-change:transform;display:block}
</style></head><body>
<b>E: 7 stacked slides + will-change + JS opacity/scale loop, p=0.35 (slide3 should show)</b>
<div class="hero-fixed" id="fx"></div>
<script>
var PHOTOS=[
 'https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/img/photo-01.webp',
 'https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/img/photo-02.webp',
 'https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/img/photo-03.webp',
 'https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/img/photo-04.webp',
 'https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/img/bw-01.webp',
 'https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/img/bw-02.webp'];
var fx=document.getElementById('fx'),slides=[];
/* slide 0 = video like real */
(function(){
  var s=document.createElement('div');s.className='hero-slide-img';
  s.innerHTML='<div class="hero-bgwrap"><div data-layer="bg"><video muted loop playsinline preload="metadata" poster="https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/video/river-leviathan-poster.jpg"><source src="https://2ndforcecrew.github.io/aka-cristi-portfolio/assets/video/river-leviathan.mp4" type="video/mp4"></video></div></div>';
  fx.appendChild(s);slides.push(s);
})();
PHOTOS.forEach(function(u){
  var s=document.createElement('div');s.className='hero-slide-img';
  s.innerHTML='<div class="hero-bgwrap"><div data-layer="bg"><picture><source type="image/webp" srcset="'+u+'"><img src="'+u.replace('.webp','.jpg')+'" loading="eager" decoding="async" fetchpriority="high" alt="t"></picture></div></div>';
  fx.appendChild(s);slides.push(s);
});
/* exact hero.js scroll.update math, fixed p=0.35, rAF loop like real */
var n=slides.length,p=0.35;
function update(){
  var f=p*(n-1);
  for(var i=0;i<n;i++){
    var o=Math.max(0,Math.min(1,1-Math.abs(i-f)));
    slides[i].style.opacity=o.toFixed(4);
    var img=slides[i].querySelector('img,video');
    if(img)img.style.transform='scale('+(1.06-0.06*o).toFixed(4)+')';
  }
  requestAnimationFrame(update);
}
update();
</script>
</body></html>
